# Skill evaluation config for amazon-connect-ops-review-troubleshooting-guide.
# Mirrors the structure used by the AWS DevOps Agent skill-eval harness.
# Development-only: exclude this file (and evals/) from the upload package.
audit:
  ignore:
    - STR-016    # README.md alongside SKILL.md is intentional
  # Documentation domains referenced throughout the skill and references —
  # allowlisted so best-practices links don't trip the external-URL audit (SEC-002).
  safe_domains:
    - aws.amazon.com
    - docs.aws.amazon.com
    - repost.aws
    - github.com
